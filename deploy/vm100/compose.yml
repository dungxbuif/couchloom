name: couchloom

services:
  postgres:
    image: pgvector/pgvector:0.8.6-pg17-bookworm
    container_name: couchloom-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: couchloom
      POSTGRES_USER: couchloom
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - pgvector_data:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U couchloom -d couchloom"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  ollama:
    image: ollama/ollama:0.34.0
    container_name: couchloom-ollama
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - internal
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  ollama-model:
    image: ollama/ollama:0.34.0
    restart: "no"
    environment:
      OLLAMA_HOST: http://couchloom-ollama:11434
    command: ["pull", "${EMBEDDING_MODEL:-nomic-embed-text}"]
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - internal
    depends_on:
      ollama:
        condition: service_healthy

  couchloom:
    image: couchloom:${COUCHLOOM_IMAGE_TAG:-vm100}
    container_name: couchloom
    build:
      context: ../..
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    read_only: true
    cpus: "2.0"
    mem_limit: 2g
    stop_grace_period: 35s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      DATABASE_URL: postgres://couchloom:${POSTGRES_PASSWORD}@couchloom-postgres:5432/couchloom
      VAULTS_CONFIG_FILE: /run/couchloom/vaults.json
      MCP_AUTH_TOKEN: ${MCP_AUTH_TOKEN:?Set MCP_AUTH_TOKEN}
      BASE_URL: http://couchloom:8787
      EMBEDDING_BASE_URL: http://couchloom-ollama:11434/v1
      EMBEDDING_API_KEY: ollama
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-nomic-embed-text}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-768}
      RAG_CHUNK_CHARS: ${RAG_CHUNK_CHARS:-1800}
      RAG_CHUNK_OVERLAP: ${RAG_CHUNK_OVERLAP:-200}
      RAG_RETRY_LIMIT: ${RAG_RETRY_LIMIT:-10}
      RAG_RETRY_DELAY_SECONDS: ${RAG_RETRY_DELAY_SECONDS:-1}
      RAG_RETRY_DELAY_MAX_SECONDS: ${RAG_RETRY_DELAY_MAX_SECONDS:-900}
      RAG_JOB_HEARTBEAT_SECONDS: ${RAG_JOB_HEARTBEAT_SECONDS:-30}
      RAG_JOB_EXPIRE_SECONDS: ${RAG_JOB_EXPIRE_SECONDS:-300}
      RAG_QUEUE_SUPERVISE_INTERVAL_SECONDS: ${RAG_QUEUE_SUPERVISE_INTERVAL_SECONDS:-30}
      RAG_DATABASE_CONNECT_TIMEOUT_MS: ${RAG_DATABASE_CONNECT_TIMEOUT_MS:-5000}
      RAG_RECONCILE_INTERVAL_MS: ${RAG_RECONCILE_INTERVAL_MS:-300000}
      RAG_WORKER_CONCURRENCY: ${RAG_WORKER_CONCURRENCY:-1}
      RAG_SHUTDOWN_GRACE_MS: ${RAG_SHUTDOWN_GRACE_MS:-30000}
    volumes:
      - couchloom_data:/data
      - ${COUCHLOOM_RUN_DIR:?Set COUCHLOOM_RUN_DIR}/vaults.json:/run/couchloom/vaults.json:ro
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    networks:
      - internal
      - homelab
    depends_on:
      postgres:
        condition: service_healthy
      ollama-model:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "bun", "-e", "const r=await fetch('http://127.0.0.1:8787/health');if(!r.ok)process.exit(1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  couchloom_data:
  pgvector_data:
  ollama_data:

networks:
  internal:
    name: couchloom-internal
  homelab:
    name: homelab-net
    external: true
