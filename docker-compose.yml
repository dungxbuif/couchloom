services:
  postgres:
    image: pgvector/pgvector:0.8.6-pg17-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: couchloom
      POSTGRES_USER: couchloom
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - pgvector_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U couchloom -d couchloom"]
      interval: 10s
      timeout: 5s
      retries: 10

  couchloom:
    build: .
    image: couchloom:local
    restart: unless-stopped
    ports:
      - "127.0.0.1:${COUCHLOOM_PORT:-8787}:8787"
    environment:
      DATABASE_URL: postgres://couchloom:${POSTGRES_PASSWORD}@postgres:5432/couchloom
      VAULTS_CONFIG: ${VAULTS_CONFIG:?Set VAULTS_CONFIG in .env}
      MCP_AUTH_TOKEN: ${MCP_AUTH_TOKEN:?Set MCP_AUTH_TOKEN in .env}
      BASE_URL: ${BASE_URL:-http://localhost:8787}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:?Set EMBEDDING_BASE_URL in .env}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:?Set EMBEDDING_MODEL in .env}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:?Set EMBEDDING_DIMENSIONS in .env}
      RAG_CHUNK_CHARS: ${RAG_CHUNK_CHARS:-1800}
      RAG_CHUNK_OVERLAP: ${RAG_CHUNK_OVERLAP:-200}
    volumes:
      - couchloom_data:/data
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgvector_data:
  couchloom_data:
